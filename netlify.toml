# Netlify Configuration for EVP Virtual Tour

[build]
  publish = "."

# Direct visitors from root domain straight into the 3D Lanyard VIP Pass
[[redirects]]
  from = "/"
  to = "/loading/"
  status = 302
  force = true

# Header optimizations for 3DVista tour assets
[[headers]]
  for = "/Tour/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Header optimizations for 3D Lanyard assets
[[headers]]
  for = "/loading/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
